name: Update Tesouro Dataset

on:
  # Schedule: Runs automatically every weekday (Monday to Friday) at 23:00 UTC
  schedule:
    - cron: "0 23 * * 1-5"
  
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the live dataset generator script
      - name: Generate dataset from live source
        run: npm run generate:dataset:live

      # Step 5: Check for changes, commit, and push back to repository if updated
      - name: Commit and push changes if dataset updated
        run: |
          git status
          if [[ -n "$(git status --porcelain)" ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.net"
            git add src/lib/data/datasets/
            git commit -m "chore: update tesouro datasets automatically [skip ci]"
            git push
          else
            echo "No changes detected in datasets. Skipping commit."
          fi